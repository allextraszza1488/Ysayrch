# [colors] below is regenerated by apply-look.sh on every SUPER+SHIFT+T
# toggle (from the active look's kitty palette) -- don't hand-edit those
# values, they get overwritten. Whatever's checked into this file is
# whichever look was last applied, not a fixed palette. 2x the default font
# size and a wider window -- the keybind cheatsheet and other lists were
# unreadable small before this existed (fuzzel had no config at all).
[main]
font=JetBrainsMono Nerd Font:size=16
width=50
lines=12
horizontal-pad=24
vertical-pad=16
inner-pad=10

[colors]
background=150E1Af5
text=E8CFE0ff
match=C23D9Dff
selection=2B1F33cc
selection-text=E8CFE0ff
selection-match=C23D9Dff
border=C23D9Dff

[border]
width=2
radius=8
