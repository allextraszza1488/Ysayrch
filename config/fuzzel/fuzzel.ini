# [colors] below is regenerated by apply-look.sh on every SUPER+SHIFT+T
# toggle (from the active look's kitty palette) -- don't hand-edit those
# values, they get overwritten. Whatever's checked into this file is
# whichever look was last applied, not a fixed palette. 2x the default font
# size and a wider window -- the keybind cheatsheet and other lists were
# unreadable small before this existed (fuzzel had no config at all).
#
# This is the SHARED dmenu backend for every menu script (launcher,
# cheatsheet, power-confirm-menu, etc) -- fuzzel auto-sizes to the actual
# match count, so raising `lines` doesn't pad short lists (a 3-item confirm
# still renders as 3 lines), it just raises the cap before scrolling kicks
# in. Bumped from 12 -> 35 so the mouse nav bar's "apps" button shows
# effectively the whole installed app list without scrolling (31 visible
# .desktop entries on this box, fits at 35 with room to spare -- confirmed
# live, rendered window stayed well within screen height). Mouse wheel
# already scrolls past the cap regardless (fuzzel 1.15+, on by default --
# see --no-mouse in `fuzzel --help`, not passed anywhere here).
[main]
font=JetBrainsMono Nerd Font:size=16
width=50
lines=35
horizontal-pad=24
vertical-pad=16
inner-pad=10

[colors]
background=150E1Af5
text=E8CFE0ff
match=C23D9Dff
selection=2B1F33cc
selection-text=E8CFE0ff
selection-match=C23D9Dff
border=C23D9Dff

[border]
width=2
radius=8
