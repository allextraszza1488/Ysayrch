# BEGIN_KITTY_THEME
# alpenflage / tigerstripe / gyaru (this machine's own palettes, not Catppuccin)
# active-look.conf is a plain copy of whichever of looks/*.conf is active --
# toggle-look.sh overwrites it, kitty.conf itself never needs editing again.
# Existing kitty windows won't pick up a change live (needs Ctrl+Shift+F5
# per window); only freshly launched ones read this at startup.
include active-look.conf
# END_KITTY_THEME

# Without this, kitty falls back to the login shell (bash, kept that way
# deliberately for the tty1 autologin flow) instead of fish -- meaning
# config.fish's startup print never actually ran.
shell /usr/bin/fish

font_size 16.0
# Japanese (kana/kanji). Reload this window: ctrl+shift+f5
symbol_map U+3000-U+303F,U+3040-U+309F,U+30A0-U+30FF,U+31F0-U+31FF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF Noto Sans JP
term xterm-256color

enable_audio_bell no
window_padding_width 4
confirm_os_window_close 0

# -----------------------------------------------------------------------------
# KEYBINDS -- trimmed to pane-splitting + copy/paste. Hyprland already owns
# OS-level window management, so kitty's own tab/font-size/etc. defaults
# were noise -- but clear_all_shortcuts also took ctrl+shift+c/v (copy/
# paste) with it on the first pass, which broke real daily use; restored
# those explicitly below. ctrl+shift+f5 is kept because two comments above
# and toggle-look.sh's whole live-reload flow depend on it.
# -----------------------------------------------------------------------------
clear_all_shortcuts yes
enabled_layouts splits
map ctrl+shift+enter  launch --location=hsplit
map ctrl+shift+s      launch --location=vsplit
map ctrl+shift+w      close_window
map ctrl+shift+]      next_window
map ctrl+shift+[      previous_window
map ctrl+shift+f5     load_config_file
map ctrl+shift+c      copy_to_clipboard
map ctrl+shift+v      paste_from_clipboard
